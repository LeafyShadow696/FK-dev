services:
  - type: web
    name: fkdev-admin-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: PUBLIC_SITE_URL
        value: https://fkdev.xyz
      - key: DATABASE_URL
        fromDatabase:
          name: fkdev-admin-db
          property: connectionString
      - key: VERCEL_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RAILWAY_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FK_STORAGE_CONNECTION
        sync: false

databases:
  - name: fkdev-admin-db
    databaseName: fkdev_admin
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
