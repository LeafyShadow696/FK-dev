    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark light" />
    <script>
      ;(() => {
        let preferencesAllowed = false
        try {
          const consent = JSON.parse(localStorage.getItem("fkdev-consent-v1") || "{}")
          preferencesAllowed = consent.preferences === true
        } catch {
          preferencesAllowed = false
        }
        let stored = null
        try {
          stored = preferencesAllowed ? localStorage.getItem("theme") : null
        } catch {
          stored = null
        }
        const theme =
          stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
        document.documentElement.classList.add(theme)
        document.documentElement.style.colorScheme = theme
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "light" ? "#f7f6fb" : "#0a0a0c")
      })()
    </script>
