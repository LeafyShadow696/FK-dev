<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PNG Security Lab</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1016">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
  <h1>PNG Security Lab</h1>
  <p>Browser → PWA → Drag &amp; Drop / Select PNG → WebAssembly → local results.</p>
  <section id="drop">Drop PNG files here or <button id="pick">Select files</button></section>
  <input id="files" hidden type="file" accept=".png,image/png" multiple>
  <button id="run">Run built-in corpus</button>
  <button id="install" hidden>Install PWA</button>
  <p id="status">Loading WebAssembly…</p>
  <pre id="results"></pre>
</main>
<script type="module" src="assets/app.js"></script>
</body>
</html>
